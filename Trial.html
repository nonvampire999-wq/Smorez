<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Love Meter 💖</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #f5f7fa, #e4ebf1);
      overflow: hidden;
    }

    .container {
      backdrop-filter: blur(25px) saturate(180%);
      -webkit-backdrop-filter: blur(25px) saturate(180%);
      background: rgba(255, 255, 255, 0.45);
      padding: 2rem;
      border-radius: 35px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,0.1);
      max-width: 420px;
      width: 100%;
      animation: fadeIn 1s ease-out;
      border: 1px solid rgba(255, 255, 255, 0.3);
      transform: translateY(10px);
      transition: transform 0.4s ease, box-shadow 0.4s ease;
    }

    .container:hover {
      transform: translateY(0);
      box-shadow: 0 15px 50px rgba(0,0,0,0.15);
    }

    h1 {
      color: #111;
      font-size: 2rem;
      margin-bottom: 1.5rem;
      animation: popIn 0.8s ease-in-out;
    }

    input {
      padding: 12px;
      margin: 8px 0;
      width: 80%;
      border-radius: 20px;
      border: none;
      font-size: 1rem;
      outline: none;
      background: rgba(255, 255, 255, 0.7);
      color: #111;
      text-align: center;
      transition: all 0.3s ease;
    }

    input::placeholder {
      color: rgba(0, 0, 0, 0.4);
    }

    input:focus {
      background: rgba(255, 255, 255, 1);
      box-shadow: 0 0 15px rgba(0,122,255,0.3);
    }

    button {
      padding: 12px 20px;
      background: linear-gradient(135deg, #007aff, #34c759);
      color: white;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      font-size: 1rem;
      margin-top: 15px;
      transition: all 0.3s ease;
      box-shadow: 0 5px 15px rgba(0, 122, 255, 0.3);
    }

    button:hover {
      transform: scale(1.05);
      box-shadow: 0 10px 25px rgba(0, 122, 255, 0.4);
    }

    .result {
      margin-top: 20px;
      font-size: 1.4rem;
      font-weight: bold;
      color: #111;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.6s ease-in-out;
    }

    .result.show {
      opacity: 1;
      transform: translateY(0);
    }

    .hearts {
      font-size: 2rem;
      margin-top: 10px;
      opacity: 0;
      transform: scale(0.5);
      transition: all 0.6s ease-in-out;
    }

    .hearts.show {
      opacity: 1;
      transform: scale(1);
    }

    .saved {
      margin-top: 25px;
      font-size: 0.9rem;
      text-align: left;
      max-height: 140px;
      overflow-y: auto;
      color: #333;
      padding: 10px;
      border-radius: 15px;
      background: rgba(255,255,255,0.25);
      border: 1px solid rgba(255,255,255,0.3);
      backdrop-filter: blur(10px);
    }

    .saved h2 {
      font-size: 1rem;
      margin-bottom: 0.5rem;
      color: #007aff;
    }

    .saved p {
      margin: 5px 0;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes popIn {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Love Meter 💖</h1>
    
    <input type="text" id="yourName" placeholder="Your Name">
    <input type="text" id="crushName" placeholder="Crush's Name"><br>
    <button onclick="calculateLove()">Check Love %</button>

    <div class="result" id="result"></div>
    <div class="hearts" id="hearts"></div>

    <div class="saved" id="savedEntries">
      <h2>Recent Results</h2>
      <div id="entriesList"></div>
    </div>
  </div>

  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js"></script>

  <script>
    // Replace with your Firebase project config
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    // Initialize Firebase
    const app = firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    async function calculateLove() {
      let yourName = document.getElementById("yourName").value.trim();
      let crushName = document.getElementById("crushName").value.trim();
      
      if(yourName === "" || crushName === "") {
        alert("Please enter both names!");
        return;
      }

      // Consistent love score
      let combined = yourName.toLowerCase() + crushName.toLowerCase();
      let hash = 0;
      for (let i = 0; i < combined.length; i++) {
        hash = combined.charCodeAt(i) + ((hash << 5) - hash);
      }
      let loveScore = Math.abs(hash % 101);

      let resultDiv = document.getElementById("result");
      let heartsDiv = document.getElementById("hearts");

      resultDiv.innerHTML = `${yourName} ❤️ ${crushName} = ${loveScore}%`;
      heartsDiv.innerHTML = "💖".repeat(Math.floor(loveScore / 20));

      resultDiv.classList.add("show");
      heartsDiv.classList.add("show");

      // Save to Firestore
      await db.collection("loveMeterResults").add({
        yourName: yourName,
        crushName: crushName,
        loveScore: loveScore,
        timestamp: new Date()
      });

      displaySavedEntries();
    }

    async function displaySavedEntries() {
      let entriesList = document.getElementById("entriesList");
      entriesList.innerHTML = "";

      const querySnapshot = await db.collection("loveMeterResults")
        .orderBy("timestamp", "desc")
        .limit(5)
        .get();

      querySnapshot.forEach((doc) => {
        let e = doc.data();
        let p = document.createElement("p");
        p.textContent = `${e.yourName} ❤️ ${e.crushName} = ${e.loveScore}%`;
        entriesList.appendChild(p);
      });
    }

    window.onload = displaySavedEntries;
  </script>
</body>
</html>
